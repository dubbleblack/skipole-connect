[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "skipole-data"
version = "0.1.0a2"
description = "Python client for Skipole licensed-data discovery and customer-approved purchasing"
requires-python = ">=3.10"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://skipoledata.com/developers"
Source = "https://github.com/dubbleblack/skipole-connect"
Documentation = "https://github.com/dubbleblack/skipole-connect/blob/main/HOSTED-PURCHASES.md"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

